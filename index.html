<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070c1c"><meta name="apple-mobile-web-app-capable" content="yes"><title>NEON DRIFT · 霓虹穿梭</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#182451 0%,#080d20 48%,#040713 100%);color:#eef5ff;display:flex;justify-content:center;align-items:center;padding:14px}.shell{width:min(100%,490px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:20px;letter-spacing:3px;margin:0;font-weight:900}h1 b{color:#6ceaff}header small{display:block;color:#879cc6;font-size:11px;letter-spacing:2px;margin-top:5px}.hud{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;background:#121d39;border:1px solid #29416a;border-radius:13px;padding:10px 12px}.stat span{display:block;color:#92a9d1;font-size:11px}.stat strong{font-size:22px;font-variant-numeric:tabular-nums}.arena{position:relative;overflow:hidden;border:1px solid #315184;border-radius:19px;box-shadow:0 0 32px #246fff21, inset 0 0 30px #2b8dff0b;touch-action:none;background:#050b1c}canvas{width:100%;display:block;aspect-ratio:3/4;touch-action:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px;background:linear-gradient(180deg,#071129dc,#061024ec);gap:14px}.overlay.hidden{display:none}.emblem{font-size:62px;filter:drop-shadow(0 0 18px #69e8ff88)}.overlay h2{font-size:29px;margin:0}.overlay p{font-size:14px;line-height:1.7;color:#b3c7e7;margin:0;max-width:280px}.action{border:0;border-radius:100px;padding:13px 34px;background:linear-gradient(110deg,#36e2ff,#7a8aff);color:#061027;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 10px 35px #42bfff44}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;color:#95a9cd;font-size:12px}.footer button{border:1px solid #2d456e;color:#d9e8ff;background:#14203d;padding:10px 14px;border-radius:10px;cursor:pointer}.legend{display:flex;gap:13px;justify-content:center;font-size:12px;color:#92a9c8;padding:11px 0}.legend b{color:#70e7ff}.legend em{color:#ff7799;font-style:normal}button:focus-visible{outline:3px solid #fff}
</style></head><body><main class="shell"><header><div><h1>NEON <b>DRIFT</b></h1><small>霓虹穿梭 · ARCADE 01</small></div><div style="font-size:28px">✦</div></header><div class="hud"><div class="stat"><span>本局分数</span><strong id="score">0</strong></div><div class="stat"><span>最高纪录</span><strong id="best">0</strong></div><div class="stat"><span>剩余生命</span><strong id="lives">♥ ♥ ♥</strong></div></div><div class="arena"><canvas id="game" width="450" height="600" aria-label="躲避陨石并收集能量的游戏"></canvas><div id="overlay" class="overlay"><div class="emblem">🚀</div><h2 id="title">准备起飞？</h2><p id="message">手指在屏幕上左右滑动，躲开红色陨石，收集金色能量球。坚持越久，得分越高！</p><button id="play" class="action">开始游戏</button></div></div><div class="legend"><span><em>◆</em> 陨石：-1 生命</span><span><b>✦</b> 能量：+25 分</span></div><div class="footer"><span>支持触屏、鼠标与 ← → 键 · 自动保存最高分</span><button id="pause">暂停</button></div></main><script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),pauseBtn=document.getElementById('pause');const W=450,H=600;let state='ready',score=0,lives=3,best=0,elapsed=0,spawn=0,objects=[],particles=[],stars=[],last=0,invulnerable=0;let player={x:W/2,y:H-73,r:17,target:W/2};let left=false,right=false;try{best=Number(localStorage.getItem('neon-drift-best')||0)}catch(e){}bestEl.textContent=best;for(let i=0;i<75;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:.4+Math.random()*1.8});function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function move(e){const r=c.getBoundingClientRect();player.target=clamp((e.clientX-r.left)/r.width*W,22,W-22)}c.addEventListener('pointerdown',e=>{if(state==='playing'){c.setPointerCapture(e.pointerId);move(e)}});c.addEventListener('pointermove',e=>{if(state==='playing'&&e.buttons)move(e)});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')left=true;if(e.key==='ArrowRight'||e.key==='d')right=true;if(e.key===' '){if(state==='playing'||state==='paused')pause()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=false;if(e.key==='ArrowRight'||e.key==='d')right=false});function reset(){score=0;lives=3;elapsed=0;spawn=0;objects=[];particles=[];invulnerable=0;player.x=W/2;player.target=W/2;state='playing';overlay.classList.add('hidden');pauseBtn.textContent='暂停';hud()}function hud(){scoreEl.textContent=Math.floor(score);livesEl.textContent='♥ '.repeat(lives).trim()||'—';bestEl.textContent=best}function end(){state='over';const s=Math.floor(score);if(s>best){best=s;try{localStorage.setItem('neon-drift-best',String(best))}catch(e){}}hud();document.getElementById('title').textContent='任务结束';document.getElementById('message').textContent=`本次获得 ${s} 分！${s===best?'刷新或追平最高纪录！':'再试一次，突破最高纪录！'}`;document.getElementById('play').textContent='再来一局';overlay.classList.remove('hidden')}function pause(){if(state==='playing'){state='paused';document.getElementById('title').textContent='已暂停';document.getElementById('message').textContent='休息一下，飞船正安全悬停。';document.getElementById('play').textContent='继续游戏';overlay.classList.remove('hidden');pauseBtn.textContent='继续'}else if(state==='paused'){state='playing';overlay.classList.add('hidden');pauseBtn.textContent='暂停'}}document.getElementById('play').addEventListener('click',()=>state==='paused'?pause():reset());pauseBtn.addEventListener('click',pause);function burst(x,y,color,count=13){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color})}}function update(dt){if(state!=='playing')return;let t=dt/16.67;elapsed+=dt;spawn+=dt;score+=dt*.012;invulnerable=Math.max(0,invulnerable-dt);let interval=Math.max(290,810-elapsed*.008);while(spawn>interval){spawn-=interval;const bonus=Math.random()<.23;objects.push({x:25+Math.random()*(W-50),y:-35,r:bonus?12:16+Math.random()*13,vy:(2.4+elapsed*.000055+Math.random()*1.3),bonus,rot:Math.random()*6})}if(left)player.target-=6.4*t;if(right)player.target+=6.4*t;player.target=clamp(player.target,22,W-22);player.x+=(player.target-player.x)*Math.min(1,.23*t);for(const s of stars){s.y+=s.z*1.5*t;if(s.y>H)s.y=0}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=o.vy*t;o.rot+=.015*t;if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r-5){objects.splice(i,1);if(o.bonus){score+=25;burst(o.x,o.y,'#ffd66d')}else if(invulnerable<=0){lives--;invulnerable=1100;burst(player.x,player.y,'#ff6e9a',22);if(lives<=0){end();return}}hud()}else if(o.y>H+40)objects.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*t;p.y+=p.vy*t;p.life-=.03*t;if(p.life<=0)particles.splice(i,1)}hud()}function draw(){ctx.clearRect(0,0,W,H);const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#0c1640');grd.addColorStop(1,'#04091a');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#49aaff10';ctx.lineWidth=1;for(let x=30;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const s of stars){ctx.fillStyle=`rgba(151,214,255,${.22+s.z*.25})`;ctx.fillRect(s.x,s.y,s.z*1.4,s.z*1.4)}for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);if(o.bonus){ctx.shadowBlur=20;ctx.shadowColor='#ffdd74';ctx.fillStyle='#ffcf59';ctx.beginPath();for(let i=0;i<8;i++){const a=Math.PI*i/4-Math.PI/2,r=i%2?6:o.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}else{ctx.shadowColor='#ff477e';ctx.shadowBlur=16;ctx.fillStyle='#dd3c70';ctx.beginPath();for(let i=0;i<9;i++){let a=i/9*Math.PI*2,r=o.r*(.82+(i%3)*.09);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ff9db3';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#852447';ctx.beginPath();ctx.arc(-o.r*.19,-o.r*.2,o.r*.24,0,Math.PI*2);ctx.fill()}ctx.restore()}for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(state!=='over'||lives){ctx.save();ctx.translate(player.x,player.y);if(invulnerable>0&&Math.floor(invulnerable/90)%2)ctx.globalAlpha=.28;ctx.shadowColor='#45e1ff';ctx.shadowBlur=26;ctx.fillStyle='#52ddff';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(19,17);ctx.lineTo(0,9);ctx.lineTo(-19,17);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e8fdff';ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(7,5);ctx.lineTo(-7,5);ctx.fill();if(state==='playing'){ctx.fillStyle='#ffb25d';ctx.beginPath();ctx.moveTo(-7,17);ctx.lineTo(0,24+Math.random()*15);ctx.lineTo(7,17);ctx.fill()}ctx.restore()}}function frame(ts){let dt=Math.min(40,ts-(last||ts));last=ts;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()})})();
</script></body></html>
